# Alerting rules for nomad-gitops.
#
# Assumes recording_rules.yml is also loaded. All expressions that reference
# nomad_gitops:* series can be rewritten to use the raw metrics directly
# if you prefer not to load the recording rules.
#
# Severity conventions used here:
#   warning  — something needs attention but is not immediately breaking
#   critical — action required; a job or the service itself is in a bad state

groups:
  - name: nomad_gitops_drift
    rules:

      # Any drift detected, alerting per job so the offending job and diff
      # type are named in the alert itself (via the `nomad_job` and `diff_type`
      # labels) rather than only a count. The exporter labels the Nomad job
      # `nomad_job`, not `job`, because Prometheus reserves `job` for the scrape
      # target name and would otherwise rename ours to `exported_job`.
      # nomad_gitops_job_diffs is 1 for each drifting (nomad_job, diff_type) and
      # absent otherwise, so the 5m 'for' window
      # means "this job has been drifting for 5m" — absorbing the normal gap
      # between a git push and the next diff check, where a job transitioning
      # through a deploy looks drifted briefly. Tune to your --diff-interval /
      # --poll-interval values. Alertmanager will group the per-job alerts
      # (e.g. group_by: [alertname]) into a single notification listing them.
      - alert: NomadJobDrift
        expr: nomad_gitops_job_diffs > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nomad job {{ $labels.nomad_job }} has drifted from git ({{ $labels.diff_type }})"
          description: >
            nomad-gitops has detected drift ({{ $labels.diff_type }}) between
            the git repo and the live Nomad cluster for job {{ $labels.nomad_job }}
            for more than 5 minutes. Check /healthz or /diffs for details.

      # A specific job has been in a modified state for an extended period.
      # This usually means a deploy is stuck or someone edited the job in
      # Nomad directly without pushing to git.
      - alert: NomadJobModifiedPersistent
        expr: >
          nomad_gitops:job_drift_age_seconds{diff_type="modified"} > 3600
        labels:
          severity: critical
        annotations:
          summary: "Nomad job {{ $labels.nomad_job }} has been modified for {{ $value | humanizeDuration }}"
          description: >
            The running definition of job {{ $labels.nomad_job }} differs from the
            HCL in git and has not been reconciled for over 1 hour.

      # A job defined in git is absent from Nomad. Could be a failed deploy,
      # an accidentally stopped job, or a job that was never submitted.
      - alert: NomadJobMissingFromNomad
        expr: >
          nomad_gitops:job_drift_age_seconds{diff_type="missing_from_nomad"} > 900
        labels:
          severity: warning
        annotations:
          summary: "Nomad job {{ $labels.nomad_job }} is defined in git but missing from Nomad"
          description: >
            Job {{ $labels.nomad_job }} is defined in git but has not been
            registered in Nomad for over 15 minutes.

      # A job is running in Nomad with no corresponding HCL file in the repo.
      # Could be an untracked legacy job or one that was manually submitted.
      - alert: NomadJobMissingFromHCL
        expr: >
          nomad_gitops:job_drift_age_seconds{diff_type="missing_from_hcl"} > 3600
        labels:
          severity: warning
        annotations:
          summary: "Nomad job {{ $labels.nomad_job }} has no HCL definition in git"
          description: >
            Job {{ $labels.nomad_job }} is running in Nomad but has no corresponding
            HCL file in the watched git repo. It has been in this state for
            {{ $value | humanizeDuration }}.

  - name: nomad_gitops_health
    rules:

      # nomad-gitops has not completed a diff check recently.
      # This fires if the service is running but stuck — e.g. the Nomad API
      # is unreachable or the diff loop has stopped for another reason.
      # Threshold should be at least 2× --diff-interval.
      - alert: NomadGitopsCheckStale
        expr: nomad_gitops:seconds_since_last_check > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "nomad-gitops has not run a diff check in {{ $value | humanizeDuration }}"
          description: >
            The last diff check was more than 5 minutes ago. The service may
            be unable to reach the Nomad API or may have crashed.

      # The git fetch loop is failing. nomad-gitops will continue checking
      # drift against the last known commit, but won't pick up new changes.
      - alert: NomadGitopsGitFetchFailing
        expr: nomad_gitops:git_fetch_error_rate5m > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "nomad-gitops git fetch is failing"
          description: >
            Git fetch/clone operations have been failing for 10 minutes.
            Drift checks continue against the last successful fetch, but
            new commits will not be picked up until fetching recovers.

      # The git repo has not been successfully fetched in a while.
      # Tune the threshold to be noticeably longer than --poll-interval.
      - alert: NomadGitopsGitStale
        expr: nomad_gitops:seconds_since_git_update > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "nomad-gitops git repo has not been updated in {{ $value | humanizeDuration }}"
          description: >
            The in-memory git checkout has not been refreshed from the remote
            in over 30 minutes. Drift checks may be running against a stale
            view of the repo.

      # Nomad API calls are failing. Depending on which operation is failing
      # (info, plan, list), some or all drift checks will produce incomplete
      # results.
      - alert: NomadGitopsAPIErrors
        expr: nomad_gitops:nomad_api_error_rate5m > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "nomad-gitops is seeing Nomad API errors (op={{ $labels.op }})"
          description: >
            Nomad API {{ $labels.op }} operations have been failing for 10
            minutes. Drift detection results may be incomplete.

      # The service is not reachable by Prometheus at all.
      - alert: NomadGitopsDown
        expr: up{job="nomad-gitops"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "nomad-gitops is not reachable"
          description: >
            Prometheus cannot scrape the nomad-gitops /metrics endpoint.
            The service may be down or the network path may be broken.

  - name: nomad_gitops_webhooks
    rules:

      # Webhook deliveries are consistently failing. The service will fall
      # back to polling, but real-time drift detection is degraded.
      - alert: NomadGitopsWebhookErrors
        expr: >
          rate(nomad_gitops_webhook_events_total{event="error"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "nomad-gitops webhook handler is returning errors"
          description: >
            Webhook events have been failing for 10 minutes. The service
            will fall back to --poll-interval-based checks. Check logs for
            signature verification or parse errors.

  - name: nomad_gitops_apply
    rules:

      # The update queue is not draining. Detected drift becomes a queued
      # JobUpdate that a separate apply loop drains, normally within one
      # --apply-interval (default 10s), so anything still pending after 15
      # minutes means the applier is stuck rather than busy. Raise the
      # threshold if you run a long --apply-interval.
      - alert: NomadGitopsUpdatesNotDraining
        expr: nomad_gitops_job_updates_pending > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "nomad-gitops has {{ $value }} update(s) pending for over 15 minutes"
          description: >
            The update queue is not draining. Check /api/v1/updates for the
            stuck updates and the logs for an apply that is failing or
            hanging. Note this fires on the pending count, so a queue that
            keeps churning without emptying holds the alert open.

  - name: nomad_gitops_freeze
    rules:

      # A freeze is a temporary, operator-set hold on applying changes to one
      # job, stored in Nomad Variables (see docs/freezing.md).
      #
      # Note the drift alerts above are deliberately NOT suppressed for a
      # frozen job: you froze it *because* it is drifting and you do not want
      # that reconciled yet, so the drift stays visible. A mechanism that
      # silences alerts as a side effect of an incident action is how drift
      # gets forgotten. For quiet during a known incident, take an
      # Alertmanager silence on the nomad_job label — explicit, time-boxed,
      # and audited by Alertmanager. Please do not "fix" this by joining the
      # drift alerts against nomad_gitops_job_frozen.

      # Frozen for over a day. Either it was forgotten, or the hold is really
      # a decision and belongs in Git.
      - alert: NomadGitopsJobFrozen
        expr: nomad_gitops:job_freeze_age_seconds > 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Nomad job {{ $labels.nomad_job }} has been frozen for {{ $value | humanizeDuration }}"
          description: >
            nomad-gitops has been withholding writes to job
            {{ $labels.nomad_job }} for over a day because of a freeze record.
            Check /api/v1/freezes for the reason. If the hold is permanent,
            express it in Git with gitops_update_policy = "none" instead.

      # A freeze with no expiry. Permitted, but it will never lift on its own,
      # so it is reported from an hour in rather than a day.
      - alert: NomadGitopsJobFrozenIndefinite
        expr: nomad_gitops:job_frozen_indefinite > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Nomad job {{ $labels.nomad_job }} is frozen with no expiry"
          description: >
            The freeze on job {{ $labels.nomad_job }} has no expires_at, so
            nomad-gitops will withhold writes to it until someone purges the
            record. Set an expiry, purge it, or move the decision into Git.

      # An expired record left lying around. It suppresses nothing — the job
      # reconciles normally again — but it misleads anyone reading the
      # Variables, and somebody meant to come back to it.
      - alert: NomadGitopsFreezeExpired
        expr: nomad_gitops_freeze_records{state="expired"} > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} expired nomad-gitops freeze record(s) left in place"
          description: >
            One or more freeze records have passed their expires_at but are
            still present. The affected jobs are reconciling normally again.
            Purge the records (nomad var purge) or set
            --freeze-expired-retention to have them cleaned up.

      # A record nomad-gitops cannot make sense of. Read conservatively as an
      # indefinite freeze on the job it appears to name, so this is blocking
      # writes.
      - alert: NomadGitopsFreezeMalformed
        expr: nomad_gitops_freeze_records{state="malformed"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} malformed nomad-gitops freeze record(s)"
          description: >
            A freeze record is missing a reason, has an unparseable
            expires_at, has a job item that disagrees with its path, or could
            not be read. nomad-gitops reads these as an indefinite freeze, so
            writes to the named job are being withheld. Fix or purge them.

      # The freeze store is unreachable. Usually a Variables ACL problem.
      - alert: NomadGitopsFreezeStoreErrors
        expr: nomad_gitops:freeze_store_error_rate5m > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "nomad-gitops cannot reach the freeze store (op={{ $labels.op }})"
          description: >
            Nomad Variables {{ $labels.op }} operations against the freeze
            prefix have been failing for 10 minutes. Usually an ACL policy
            problem. If the store has never been readable, no freeze is being
            honoured at all (applies are deliberately not held in that state);
            if it worked and then stopped, applies are held once the view
            passes --freeze-max-staleness. Either way drift detection is
            unaffected. Check store_healthy on /api/v1/freezes.

      # The cached freeze view has gone stale, so every apply is held.
      # Threshold must exceed --freeze-max-staleness (default 5m).
      - alert: NomadGitopsFreezeViewStale
        expr: nomad_gitops:seconds_since_freeze_store_read > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "nomad-gitops freeze view is {{ $value | humanizeDuration }} stale — all applies held"
          description: >
            nomad-gitops has not read the freeze store within
            --freeze-max-staleness and is therefore withholding every apply
            (fail-closed). Drift is still detected and reported. Fix the
            Variables ACL or set --freeze-fail-open to take the other trade.
